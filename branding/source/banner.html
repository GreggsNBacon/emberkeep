<!DOCTYPE html><html><head><style>
  html,body{margin:0;width:1360px;height:480px;overflow:hidden}
  .b{position:relative;width:1360px;height:480px;overflow:hidden;font-family:"Segoe UI Variable Display","Segoe UI",sans-serif;
     background:radial-gradient(ellipse 720px 520px at 6% 0%,rgba(255,122,42,.75),rgba(211,47,63,.3) 45%,transparent 75%),
                radial-gradient(ellipse 780px 520px at 100% 110%,rgba(255,178,58,.55),rgba(242,122,24,.22) 45%,transparent 75%),
                radial-gradient(ellipse 520px 300px at 55% 50%,rgba(255,106,43,.12),transparent 70%),#140c0c}
  /* faint rack lines */
  .grid{position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 2px,transparent 2px 48px);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 75%,transparent)}
  .content{position:absolute;left:380px;top:0;bottom:0;display:flex;align-items:center;gap:40px}
  .logo{width:190px;height:190px;filter:drop-shadow(0 0 40px rgba(255,106,43,.5))}
  h1{margin:0;color:#fff;font-weight:700;font-size:124px;letter-spacing:-3px;line-height:1}
  p{margin:16px 0 0 4px;color:#ecd9cf;font-size:34px;font-weight:500;letter-spacing:.2px}
  .tags{display:flex;gap:14px;margin:26px 0 0 4px}
  .tag{display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#f6ebe4;font:600 22px "Segoe UI Variable Text","Segoe UI",sans-serif}
  .dot{width:11px;height:11px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.2)}
</style></head><body><div class="b">
  <div class="grid"></div>
  <div class="content">
    <img class="logo" src="emberkeep.svg">
    <div>
      <h1>Emberkeep</h1>
      <p>Your game servers, one tap away</p>
      <div class="tags"><span class="tag"><span class="dot"></span>Live status</span><span class="tag">Join addresses</span><span class="tag">/servers · /ip</span></div>
    </div>
  </div>
</div></body></html>
