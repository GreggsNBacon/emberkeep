<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Emberkeep</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script src="/theme.js"></script>
<link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
<form class="login" id="f">
  <div class="brand"><img src="/favicon.svg" alt="" width="28" height="28"><span>Emberkeep</span></div>
  <h1>Sign in</h1>
  <p>Sign in with the account the host made for you.</p>
  <input class="input" id="user" type="text" autocomplete="username" aria-label="Username" placeholder="Username" autofocus required spellcheck="false" autocapitalize="off">
  <input class="input" id="pw" type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" required>
  <button class="btn btn-primary" type="submit">Sign in</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Emberkeep': '1' },
      body: JSON.stringify({ username: document.getElementById('user').value, password: document.getElementById('pw').value }),
    });
    if (r.ok) { location.href = '/'; return; }
    const d = await r.json().catch(() => ({}));
    err.textContent = d.error || 'Sign-in failed.';
  } catch { err.textContent = 'Can\'t reach Emberkeep. Is it running on the host PC?'; }
});
</script>
</body>
</html>
